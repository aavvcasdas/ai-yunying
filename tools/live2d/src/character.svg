<!--
  ── 替换成自己的立绘（可选）──────────────────────────────────────────
  不做矢量重绘、想直接用现有立绘的话：
    把每个 PART 里的图形换成 <image href="..."/> 并贴到同一坐标即可，
    图层名与切分方式都不用改，build.mjs 照样出 PSD。
  下面两个槽位分别对应项目现有的两张角色图：
    dafeiyu.webp                        → 项目默认鲸鱼娘（站点根目录）
    tools/day3制作/whale_girl_src/pose_*.png  → 41 张高清差分姿势
  用法示例（把 imagePose 里的注释去掉、填上实际文件）：
    <image href="../../../../dafeiyu.webp" x="0" y="0" width="1024" height="1024"/>
  ⚠ 直接整张塞进去只能做「一张图 + 差分」，没有部件可动；
    要做真正能动的模型，必须按上面 27 个部件分别切图。
-->
<g id="imagePose" style="display:none"></g>

