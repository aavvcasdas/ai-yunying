<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>鲸鱼娘 · Live2D 分层骨架预览</title>
<style>
  :root{
    --bg:#0b1020; --panel:#131a2e; --line:#243055; --txt:#dfe6f7; --dim:#8794b5;
    --accent:#6fb3e8; --accent2:#8fd0ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:radial-gradient(1200px 700px at 50% 0%,#1a2340 0%,var(--bg) 60%);
    color:var(--txt); font:14px/1.55 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header{padding:18px 24px 6px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px}
  .tag{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
  main{display:grid;grid-template-columns:minmax(320px,1fr) 380px;gap:18px;padding:10px 24px 28px;flex:1;align-items:start}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .stage-wrap{
    position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    background:
      linear-gradient(45deg,#151d33 25%,transparent 25%,transparent 75%,#151d33 75%) 0 0/28px 28px,
      linear-gradient(45deg,#151d33 25%,#101728 25%,#101728 75%,#151d33 75%) 14px 14px/28px 28px;
    display:flex;justify-content:center;
  }
  canvas{display:block;width:100%;height:auto;max-height:74vh;object-fit:contain}
  .badge{
    position:absolute;left:12px;top:12px;font-size:11px;color:#9fb0d8;background:#0b1020cc;
    border:1px solid var(--line);border-radius:8px;padding:4px 9px;backdrop-filter:blur(4px)
  }
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px}
  .panel h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:500;letter-spacing:.6px;text-transform:uppercase}
  .row{margin-bottom:13px}
  .row label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;color:#c3cde8}
  .row label b{color:var(--accent2);font-weight:500;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:99px;background:#26314f;outline:none}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);
    border:2px solid #0b1020;box-shadow:0 0 0 1px var(--accent);
  }
  .toggles{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
  .chip{
    font-size:12px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);
    background:#0f1628;color:#a9b7d8;cursor:pointer;user-select:none;transition:.15s
  }
  .chip.on{background:#1b2b4d;border-color:var(--accent);color:var(--accent2)}
  .layers{max-height:230px;overflow:auto;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
  .layer{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:3px 0;color:#b6c2de}
  .layer .sw{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:8px;background:var(--accent)}
  .layer em{color:#6d7ba0;font-style:normal;font-size:11px}
  .foot{margin-top:12px;font-size:11.5px;color:#68769a;line-height:1.7}
  .foot code{color:#94a6cf;background:#0d1424;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>鲸鱼娘 · 分层骨架预览</h1>
  <span class="tag" id="meta">加载中…</span>
  <span class="tag">参数驱动的伪 Live2D（层分离 + 变形）</span>
</header>

<main>
  <div class="stage-wrap">
    <canvas id="stage" width="2048" height="2048"></canvas>
    <div class="badge">拖滑块 → 实时驱动 27 个独立图层</div>
  </div>

  <div class="panel">
    <h2>参数 / Parameters</h2>
    <div class="row"><label>ParamAngleX（转头）<b id="v-ax">0</b></label>
      <input id="ax" type="range" min="-30" max="30" value="0"></div>
    <div class="row"><label>ParamAngleY（抬头低头）<b id="v-ay">0</b></label>
      <input id="ay" type="range" min="-30" max="30" value="0"></div>
    <div class="row"><label>ParamAngleZ（歪头）<b id="v-az">0</b></label>
      <input id="az" type="range" min="-30" max="30" value="0"></div>
    <div class="row"><label>ParamBodyAngleX（身体）<b id="v-bx">0</b></label>
      <input id="bx" type="range" min="-10" max="10" value="0"></div>
    <div class="row"><label>ParamEyeOpen（睁眼）<b id="v-eo">1.00</b></label>
      <input id="eo" type="range" min="0" max="100" value="100"></div>
    <div class="row"><label>ParamMouthOpenY（张嘴）<b id="v-mo">0.00</b></label>
      <input id="mo" type="range" min="0" max="100" value="0"></div>

    <h2 style="margin-top:18px">自动化 / Automation</h2>
    <div class="toggles">
      <div class="chip on" data-auto="blink">自动眨眼</div>
      <div class="chip on" data-auto="breath">呼吸</div>
      <div class="chip on" data-auto="sway">头发/尾巴摆动</div>
      <div class="chip" data-auto="talk">说话口型</div>
    </div>

    <h2>图层 / Layers</h2>
    <div class="layers" id="layers"></div>

    <div class="foot">
      素材：<code>tools/live2d/src/character.svg</code> → <code>out/whale_girl.psd</code>（27 层，2048²）<br>
      命名遵循 psd2live 语义规范，可直接 <code>Ctrl+O</code> 导入自动绑骨。
    </div>
  </div>
</main>

<script type="module" src="viewer.js"></script>
</body>
</html>
